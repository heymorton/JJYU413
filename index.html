const allVideos=[].concat(...Object.values(stageVideos))

function showTodayResult(data){
  document.getElementById("card").classList.add("flip");
  document.getElementById("result").innerHTML=`<h2>✨ 今日啾势</h2>
  <p>💿 推荐歌曲：${data.song}</p>
  <p>🎨 幸运色：${data.colorChoice}</p>
  <p>🌟 运势：${data.fortuneText}</p>
  <h3>🎬 今日舞台</h3>
  ${data.video && allVideos.includes(data.video)?
    `<iframe src="https://player.bilibili.com/player.html?bvid=${data.video}" width="100%" height="420" allowfullscreen allow="autoplay; fullscreen"></iframe>
    <br><a class="watch" href="https://www.bilibili.com/video/${data.video}" target="_blank">▶ 去Bilibili观看</a>`:
    `<p>⚠ 今日舞台视频不可用</p>`}`;
}

window.addEventListener("load",()=>{
  const today=new Date().toDateString();
  let todayData=JSON.parse(localStorage.getItem("todayData")||"null");
  let times=parseInt(localStorage.getItem("drawTimes")||"0");
  const lastDate=localStorage.getItem("fortuneDate");
  if(lastDate!==today){times=0; localStorage.setItem("drawTimes",0)}
  updateRemaining(2-times);
  if(todayData && lastDate===today){showTodayResult(todayData)}
})

function drawFortune(){let times=parseInt(localStorage.getItem("drawTimes")||"0"); if(times>=2)return; generateFortune()}
function repeatFortune(){let times=parseInt(localStorage.getItem("drawTimes")||"0"); if(times>=2)return; generateFortune()}

function generateFortune(){
  const card=document.getElementById("card"); card.classList.remove("flip");
  let musicType=document.getElementById("musicType").value;
  let colorChoice=document.getElementById("colorChoice").value;
  const songList=songs[musicType]||[].concat(...Object.values(songs));
  const song=random(songList);
  let video=null;
  if(colorChoice==="未知"){
    const colors=Object.keys(stageVideos); colorChoice=random(colors);
    video=random(stageVideos[colorChoice])
  } else if(stageVideos[colorChoice] && stageVideos[colorChoice].length>0){
    video=random(stageVideos[colorChoice])
  } else {
    video=random(allVideos)
  }
  const fortunes=["今日好运连连 ✨","小心谨慎,稳中求胜 ⚠️","遇见惊喜的可能 💖","适合休息与放松 🌿","挑战与成长并存 💪"];
  const fortuneText=random(fortunes);
  const todayData={musicType,colorChoice,song,video,fortuneText};
  const today=new Date().toDateString();
  localStorage.setItem("fortuneDate",today);
  localStorage.setItem("todayData",JSON.stringify(todayData));
  let drawTimes=parseInt(localStorage.getItem("drawTimes")||"0");
  drawTimes++; localStorage.setItem("drawTimes",drawTimes); updateRemaining(2-drawTimes);
  card.classList.add("flip");
  setTimeout(()=>{showTodayResult(todayData)},800)
}

function updateRemaining(count){document.getElementById("remaining").innerText=`今日剩余抽取次数：${count}`}

/* 星空动画 */
const canvas=document.getElementById("stars");
const ctx=canvas.getContext("2d");
canvas.width=window.innerWidth;
canvas.height=window.innerHeight;
let stars=[];
for(let i=0;i<120;i++){
  stars.push({x:Math.random()*canvas.width,y:Math.random()*canvas.height,r:Math.random()*1.5,alpha:Math.random()*0.8+0.2,delta:(Math.random()*0.02)+0.005});
}
window.addEventListener("resize",()=>{canvas.width=window.innerWidth;canvas.height=window.innerHeight});
function drawStars(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  stars.forEach(s=>{
    s.alpha+=s.delta;
    if(s.alpha>1||s.alpha<0.2) s.delta=-s.delta;
    ctx.fillStyle=`rgba(255,255,255,${s.alpha})`;
    ctx.beginPath();
    ctx.arc(s.x,s.y,s.r,0,Math.PI*2);
    ctx.fill();
  });
  requestAnimationFrame(drawStars);
}
drawStars();
</script>
